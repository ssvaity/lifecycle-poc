[project]
name = "lifecycle-poc"
version = "0.1.0"
description = "POC: look up a product's end-of-life / end-of-support dates with citations, comparing SearchAPI.io and Exa."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.12",
    "python-dateutil>=2.9",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lifecycle = "lifecycle.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lifecycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
